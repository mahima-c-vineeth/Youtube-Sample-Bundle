# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "youtube-sample-bundle"

include:
  - resources/*.yml
  - resources/*/*.yml

variables:
  catalog_name:
    description: 'A catalog name of the project' 
    default: 'agent'

  schema_name:
    description: 'A schema name of the project' 
    default: 'bronze'

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-bface573-242f.cloud.databricks.com
      root_path: /Users/mahimavineeth3@gmail.com/github_actions

    variables:
      catalog_name : "agent_dev"
      schema_name : "bronze_dev"

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://dbc-bface573-242f.cloud.databricks.com
      # We always use /Users/mahimavineeth3@gmail.com for all resources to make sure we only have a single copy.
      root_path: /Users/mahimavineeth3@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name : "agent_prod"
      schema_name : "bronze_prod"
    run_as:
      # This runs as mahimavineeth3@gmail.com in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: mahimavineeth3@gmail.com
